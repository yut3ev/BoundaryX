[package]
name = "boundaryx-desktop"
version = "0.1.1"
description = "BoundaryX Security Research Desktop Workbench"
authors = ["BoundaryX Contributors"]
edition = "2021"

[lib]
name = "boundaryx_desktop"
path = "src/lib.rs"

[[bin]]
name = "boundaryx-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
