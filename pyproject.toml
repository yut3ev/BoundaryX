[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundaryx"
version = "0.1.1"
description = "Desktop Application Security Testing & Authorization Analysis Tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "BoundaryX Contributors"}
]
keywords = ["security", "authorization", "testing", "desktop", "access-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
]

dependencies = [
    "PySide6>=6.7.0,<7.0",
    "SQLAlchemy>=2.0.30,<3.0",
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "networkx>=3.3,<4.0",
    "cryptography>=43.0,<45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-qt>=4.4,<5.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5.0",
    "pyinstaller>=6.8,<7.0",
]

[project.scripts]
boundaryx = "boundaryx.app:main"

[project.gui-scripts]
boundaryx-gui = "boundaryx.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "TC", "N802", "B007", "UP042", "N806", "A002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "gui: marks tests requiring GUI",
    "security: marks security-specific tests",
    "integration: marks integration tests",
]
