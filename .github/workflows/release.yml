name: BoundaryX Release Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-release:
    name: Build Linux x86_64 Packages (.deb & .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tauri Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config squashfs-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Engine & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "engine[dev]"

      - name: Run Engine Test Suite
        run: |
          python -m pytest engine/tests/ -v --tb=short

      - name: Build Standalone Engine Sidecar
        run: |
          python scripts/build_engine.py --target boundaryx-engine-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/boundaryx-engine-x86_64-unknown-linux-gnu
          apps/desktop/src-tauri/binaries/boundaryx-engine-x86_64-unknown-linux-gnu --ping

      - name: Run Desktop IPC & Sidecar Integration Test
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -- --nocapture

      - name: Install Desktop Frontend & Build Assets
        run: |
          cd apps/desktop
          npm ci
          npm run build

      - name: Build Tauri Desktop Packages (.deb and .AppImage)
        run: |
          cd apps/desktop
          npx @tauri-apps/cli build --bundles deb,appimage

      - name: Collect Release Artifacts, SBOM & Checksums
        run: |
          mkdir -p release-artifacts

          BUNDLE_ROOT="apps/desktop/src-tauri/target/release/bundle"

          # Verify and copy .deb packages (fail if missing or empty)
          DEB_FOUND=0
          for deb in "$BUNDLE_ROOT"/deb/*.deb; do
            if [ -s "$deb" ]; then
              cp "$deb" release-artifacts/
              DEB_FOUND=1
            fi
          done
          if [ "$DEB_FOUND" -ne 1 ]; then
            echo "[-] FATAL: Required .deb package was not generated or is empty in $BUNDLE_ROOT/deb!" >&2
            exit 1
          fi

          # Verify and copy .AppImage packages (fail if missing or empty)
          APPIMAGE_FOUND=0
          for app in "$BUNDLE_ROOT"/appimage/*.AppImage; do
            if [ -s "$app" ]; then
              cp "$app" release-artifacts/
              APPIMAGE_FOUND=1
            fi
          done
          if [ "$APPIMAGE_FOUND" -ne 1 ]; then
            echo "[-] FATAL: Required .AppImage package was not generated or is empty in $BUNDLE_ROOT/appimage!" >&2
            exit 1
          fi

          # Generate dynamic SBOM covering lockfiles
          python scripts/generate_sbom.py --output release-artifacts/SBOM.json
          if [ ! -s "release-artifacts/SBOM.json" ]; then
            echo "[-] FATAL: SBOM.json is missing or 0 bytes!" >&2
            exit 1
          fi

          # Compute SHA-256 for all release artifacts
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cd ..

          # Run deep integrity audit on all release artifacts
          python scripts/generate_sbom.py --verify-artifacts release-artifacts

          echo "=========================================="
          echo "Verified Release Artifacts:"
          ls -la release-artifacts
          echo "------------------------------------------"
          cat release-artifacts/SHA256SUMS.txt
          echo "=========================================="

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-artifacts/*
            CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
