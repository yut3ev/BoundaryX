name: BoundaryX Release Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-release:
    name: Build Linux x86_64 Packages (.deb & .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tauri Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Engine & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "engine[dev]"

      - name: Run Engine Test Suite
        run: |
          python -m pytest engine/tests/ -v --tb=short

      - name: Build Standalone Engine Sidecar
        run: |
          python scripts/build_engine.py --target boundaryx-engine-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/boundaryx-engine-x86_64-unknown-linux-gnu
          apps/desktop/src-tauri/binaries/boundaryx-engine-x86_64-unknown-linux-gnu --ping

      - name: Install Desktop Frontend & Build Assets
        run: |
          cd apps/desktop
          npm ci
          npm run build

      - name: Build Tauri Desktop Packages (.deb and .AppImage)
        run: |
          cd apps/desktop
          npx @tauri-apps/cli build --bundles deb,appimage

      - name: Collect Release Artifacts, SBOM & Checksums
        run: |
          mkdir -p release-artifacts
          python scripts/generate_sbom.py
          cp docs/SBOM.json release-artifacts/
          
          # Copy bundled packages
          if compgen -G "apps/desktop/src-tauri/target/release/bundle/deb/*.deb" > /dev/null; then
            cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb release-artifacts/
          fi
          if compgen -G "apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage" > /dev/null; then
            cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/
          fi

          # Compute SHA-256 for all artifacts
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "Release artifacts and hashes:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
            CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
