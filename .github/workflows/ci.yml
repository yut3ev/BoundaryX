name: BoundaryX Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  engine-tests:
    name: Python Engine Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "engine/uv.lock"

      - name: Run Ruff Linter
        run: |
          uv run --project engine ruff check --config engine/pyproject.toml engine/

      - name: Run Pytest Test Suite
        run: |
          uv run --project engine pytest engine/tests -v

  frontend-check:
    name: Desktop Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/desktop
          npm ci

      - name: TypeScript Typecheck
        run: |
          cd apps/desktop
          npx tsc --noEmit

      - name: Production Build Check
        run: |
          cd apps/desktop
          npm run build
