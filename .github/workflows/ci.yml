name: BoundaryX Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  engine-tests:
    name: Python Engine Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "engine/uv.lock"

      - name: Run Ruff Linter
        run: |
          uv run --project engine --extra dev ruff check --config engine/pyproject.toml engine/

      - name: Run Pytest Test Suite
        run: |
          uv run --project engine --extra dev pytest engine/tests -v

  frontend-check:
    name: Desktop Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/desktop
          npm ci

      - name: TypeScript Typecheck
        run: |
          cd apps/desktop
          npx tsc --noEmit

      - name: Production Build Check
        run: |
          cd apps/desktop
          npm run build

  desktop-rust-integration:
    name: Tauri Desktop Rust & Sidecar IPC Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tauri Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "engine[dev]"

      - name: Build Standalone Python Engine Sidecar
        run: |
          python scripts/build_engine.py --target boundaryx-engine-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/boundaryx-engine-x86_64-unknown-linux-gnu
          apps/desktop/src-tauri/binaries/boundaryx-engine-x86_64-unknown-linux-gnu --ping

      - name: Rust Compile Check
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Run Desktop IPC & Sidecar Smoke Test
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -- --nocapture
